<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primary512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg512)"/>
  <rect x="64" y="64" width="384" height="384" rx="60" fill="none" stroke="url(#primary512)" stroke-width="8" stroke-opacity="0.35"/>
  <!-- Barcode Bars -->
  <g fill="#f8fafc">
    <rect x="110" y="150" width="16" height="200" rx="8"/>
    <rect x="142" y="150" width="32" height="200" rx="8"/>
    <rect x="190" y="150" width="10" height="200" rx="5"/>
    <rect x="216" y="150" width="28" height="200" rx="8"/>
    <rect x="260" y="150" width="16" height="200" rx="8"/>
    <rect x="292" y="150" width="38" height="200" rx="8"/>
    <rect x="346" y="150" width="16" height="200" rx="8"/>
    <rect x="378" y="150" width="12" height="200" rx="6"/>
  </g>
  <!-- Laser Beam -->
  <line x1="80" y1="250" x2="432" y2="250" stroke="#ef4444" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Check Circle -->
  <circle cx="380" cy="380" r="56" fill="#10b981"/>
  <path d="M360 380l14 14 28-28" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
